[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hicopd-unimetricnet"
version = "11.2.0"
description = "HiCOPD-UniMETRICNet v11.2 Ultimate: Quality-Gated Multi-Expert Hierarchical Respiratory Acoustic Measurement Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
